<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regla de Cálculo Rietz – versión final con límites y guía visual</title>
<style>
  :root { --bg:#0d1117; --ink:#0f172a; --hair:#d41111; --panel-bg:#1b2333; }
  body{ margin:0; background:var(--bg); color:#dbe7ff; font-family:system-ui,sans-serif;
        display:flex; flex-direction:column; align-items:center; padding:24px; gap:12px;}
  h1{ margin:0; font-size:18px; color:#e8f2ff;}
  .wrapper{ display:flex; gap:24px; align-items:flex-start;}
  canvas{ background:#f8fbff; border-radius:10px; box-shadow:0 6px 30px rgba(0,0,0,.3); display:block;}
  .panel{ width:260px; background:var(--panel-bg); color:#eaf1ff; border-radius:12px; padding:16px;
          box-shadow:0 4px 20px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:8px;}
  .panel h2{ font-size:15px; margin:0 0 6px; text-align:center; color:#5bd4ff;}
  .readout{ display:flex; justify-content:space-between; border-bottom:1px solid #27344b; padding:2px 0; font-size:13px;}
  .readout span{ font-family:monospace; color:#fff;}
  .hint{ font-size:13px; color:#9fb1cc; text-align:center;}
</style>
</head>
<body>
  <h1>Regla de Cálculo Rietz – versión final</h1>
  <div class="wrapper">
    <canvas id="rule" width="1550" height="900"></canvas>
    <div class="panel">
      <h2>Lecturas del pelito</h2>
      <div id="values"></div>
    </div>
  </div>
  <div class="hint">Arrastra el reglón móvil (B, CI, C). Mueve la línea roja (pelito). Doble clic para centrar.</div>

<script>
(() => {
  const canvas=document.getElementById("rule");
  const ctx=canvas.getContext("2d");
  const W=canvas.width, H=canvas.height;
  const P={ left:80, right:40 };
  const innerW=W-P.left-P.right;
  const panel=document.getElementById("values");
  const deg2rad = d => d * Math.PI / 180;
  const rad2deg = r => r * 180 / Math.PI;
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

  const lanes=[
    { key:'L',  y:  80,  h:26, type:'fixed', label:'L (log₁₀)' },
    { key:'K',  y: 155, h:26, type:'fixed', label:'K (x³)' },
    { key:'A',  y: 230, h:26, type:'fixed', label:'A (x²)' },
    { key:'B',  y: 305, h:26, type:'slide', label:'B (x²)' },
    { key:'CI', y: 380, h:26, type:'slide', label:'CI (1/x)' },
    { key:'C',  y: 455, h:26, type:'slide', label:'C (×, ÷)' },
    { key:'D',  y: 530, h:26, type:'fixed', label:'D (×, ÷)' },
    { key:'S',  y: 620, h:26, type:'fixed', label:'S (sin, 5°–90°)' },
    { key:'ST', y: 680, h:26, type:'fixed', label:'ST (sen pequeño)' },
    { key:'T',  y: 740, h:26, type:'fixed', label:'T (tan, 5°–45°)' },
  ];

  const slideTop = lanes.find(l=>l.key==='B').y - 30;
  const slideBottom = lanes.find(l=>l.key==='C').y + 30;
  const slideMin = -innerW*0.9;
  const slideMax = innerW*0.9;
  const hairMin = P.left;
  const hairMax = P.left + innerW;

  let slideOffset=0;
  let hairX=P.left+innerW*0.6;
  let dragging=null, dragDX=0;

  const log10=x=>Math.log(x)/Math.LN10;
  const pow10=x=>Math.pow(10,x);

  const xFrom={
    normal: v=>P.left+log10(clamp(v,1,10))*innerW,
    inv:    v=>P.left+(1-log10(clamp(v,1,10)))*innerW,
    A:      v=>P.left+(log10(clamp(v,1,100))/2)*innerW,
    K:      v=>P.left+(log10(clamp(v,1,1000))/3)*innerW,
    L:      v=>P.left+log10(clamp(v,1,10))*innerW,
    S:      θ=>P.left+log10(clamp(10*Math.sin(deg2rad(θ)),1,10))*innerW,
    ST:     θ=>P.left+log10(clamp(10*deg2rad(θ),1,10))*innerW,
    T:      θ=>P.left+log10(clamp(10*Math.tan(deg2rad(θ)),1,10))*innerW,
  };

  const valFrom={
    normal: x=>clamp(pow10((x-P.left)/innerW),1,10),
    inv:    x=>clamp(1/pow10((x-P.left)/innerW),1,10),
    A:      x=>clamp(Math.pow(10,2*(x-P.left)/innerW),1,100),
    K:      x=>clamp(Math.pow(10,3*(x-P.left)/innerW),1,1000),
    L:      x=>clamp((x-P.left)/innerW,0,1),
    S:      x=>rad2deg(Math.asin(clamp(pow10((x-P.left)/innerW)/10,0,1))),
    ST:     x=>rad2deg(clamp(pow10((x-P.left)/innerW)/10,0,Math.PI/2)),
    T:      x=>rad2deg(Math.atan(clamp(pow10((x-P.left)/innerW)/10,0,10))),
  };

  function drawAll(){
    ctx.clearRect(0,0,W,H);
    drawFixedBody();
    drawSlideBody();
    drawSlideBoundaries(); // líneas delimitadoras negras
    drawHair();
    drawLabels();
    updateReadouts();
  }

  function drawFixedBody(){
    for(const lane of lanes.filter(l=>l.type==='fixed')){
      drawTrack(lane.y,lane.h);
      drawScale(lane,false);
    }
  }
  function drawSlideBody(){
    ctx.save();
    ctx.translate(slideOffset,0);
    const top=lanes.find(l=>l.key==='B').y-20;
    const bottom=lanes.find(l=>l.key==='C').y+20;
    ctx.fillStyle='#fefefe';
    ctx.fillRect(0,top,W,bottom-top);
    for(const lane of lanes.filter(l=>l.type==='slide')){
      drawTrack(lane.y,lane.h);
      drawScale(lane,true);
    }
    ctx.restore();
  }

  // líneas negras de delimitación del bloque móvil
  function drawSlideBoundaries(){
    ctx.save();
    ctx.strokeStyle='#000';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(P.left-20,slideTop);
    ctx.lineTo(W-P.right+20,slideTop);
    ctx.moveTo(P.left-20,slideBottom);
    ctx.lineTo(W-P.right+20,slideBottom);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrack(y,h){
    ctx.fillStyle='#eef3f8';
    ctx.strokeStyle='#cfd6e0';
    ctx.beginPath();
    ctx.roundRect(40,y-h/2,W-80,h,6);
    ctx.fill(); ctx.stroke();
  }

  function drawScale(lane,isSlide){
    const slideX=isSlide?slideOffset:0;
    const top=lane.y-lane.h/2;
    const bottom=lane.y+lane.h/2;
    ctx.save();
    ctx.strokeStyle='#1b2430';
    ctx.fillStyle='#1b2430';
    ctx.lineWidth=1;

    const drawTick=(x,len,label)=>{
      ctx.beginPath();
      ctx.moveTo(x+slideX,top);
      ctx.lineTo(x+slideX,top+lane.h*len);
      ctx.stroke();
      if(label!==undefined){
        ctx.font='11px system-ui';
        ctx.textAlign='center';
        ctx.textBaseline='top';
        ctx.fillText(label,x+slideX,bottom+2);
      }
    };

    const drawLog=(fnInv=false)=>{
      for(let i=1;i<10;i++){
        const x=fnInv?xFrom.inv(i):xFrom.normal(i);
        drawTick(x,0.8,String(i));
        for(let j=1;j<10;j++){
          const val=i+j/10; if(val>=10) break;
          const xs=fnInv?xFrom.inv(val):xFrom.normal(val);
          drawTick(xs,j%5===0?0.55:0.35);
        }
      }
    };
    const drawAB=(power)=>{
      const fn=(v)=>P.left+(log10(clamp(v,1,Math.pow(10,power)))/power)*innerW;
      for(let decade=0;decade<power;decade++){
        const start=Math.pow(10,decade), end=start*10;
        for(let i=1;i<10;i++){
          const v=start*i, x=fn(v);
          drawTick(x,0.8,String(v));
          for(let j=1;j<10;j++){
            const vv=v + j*(start/10); if(vv>=end) break;
            const xs=fn(vv); drawTick(xs,j%5===0?0.55:0.35);
          }
        }
      }
    };
    const drawL=()=>{
      for(let k=0;k<=10;k++){
        const t=k/10, v=pow10(t), x=xFrom.L(v);
        drawTick(x,0.8,t.toFixed(1));
        if(k<10){
          for(let m=1;m<10;m++){
            const tSub=t+m/100, vSub=pow10(tSub), xSub=xFrom.L(vSub);
            drawTick(xSub,m===5?0.55:0.35);
          }
        }
      }
    };
    const drawS=()=>{for(let d=5;d<=90;d+=5){const x=xFrom.S(d);drawTick(x,0.8,String(d));for(let j=1;j<5;j++){const dd=d+j;if(dd>=90)break;const xs=xFrom.S(dd);drawTick(xs,j===2?0.55:0.35);}}};
    const drawST=()=>{for(let d=0.5;d<=5.5;d+=0.5){const x=xFrom.ST(d);drawTick(x,0.8,d.toFixed(1));for(let j=1;j<5;j++){const dd=d+j*0.1;if(dd>=5.7)break;const xs=xFrom.ST(dd);drawTick(xs,j===2?0.55:0.35);}}};
    const drawT=()=>{for(let d=5;d<=45;d+=5){const x=xFrom.T(d);drawTick(x,0.8,String(d));for(let j=1;j<5;j++){const dd=d+j;if(dd>=45)break;const xs=xFrom.T(dd);drawTick(xs,j===2?0.55:0.35);}}};

    switch(lane.key){
      case 'C': case 'D': drawLog(false); break;
      case 'CI': drawLog(true); break;
      case 'A': case 'B': drawAB(2); break;
      case 'K': drawAB(3); break;
      case 'L': drawL(); break;
      case 'S': drawS(); break;
      case 'ST': drawST(); break;
      case 'T': drawT(); break;
    }
    ctx.restore();
  }

  function drawLabels(){
    ctx.save();
    ctx.fillStyle='#1b2430';
    ctx.font='bold 12px system-ui';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    for(const lane of lanes){
      const top=lane.y-lane.h/2;
      ctx.fillText(lane.label,P.left,top-6);
    }
    ctx.restore();
  }

  function drawHair(){
    ctx.save();
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--hair');
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(hairX,40);
    ctx.lineTo(hairX,H-40);
    ctx.stroke();
    ctx.restore();
  }

  function updateReadouts(){
    const data=[];
    for(const lane of lanes){
      let val=null;
      const xPos=clamp(hairX-(lane.type==='slide'?slideOffset:0),P.left,P.left+innerW);
      if(valFrom[lane.key]) val=valFrom[lane.key](xPos);
      if(typeof val==='number'){
        if(['S','T','ST'].includes(lane.key)) val=val.toFixed(2)+'°';
        else if(lane.key==='L') val=val.toFixed(3);
        else val=Number(val).toPrecision(6);
      }
      data.push({name:lane.label,val});
    }
    panel.innerHTML=data.map(d=>`<div class="readout"><span>${d.name}</span><span>${d.val}</span></div>`).join('');
  }

  // --- Interacción con límites ---
  canvas.addEventListener('mousedown',e=>{
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    if(Math.abs(x-hairX)<10){ dragging='hair'; }
    else if(y>slideTop && y<slideBottom){ dragging='slide'; dragDX=x-slideOffset; }
  });
  canvas.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left;
    if(dragging==='hair') hairX=clamp(x,hairMin,hairMax);
    if(dragging==='slide'){
      slideOffset=clamp(x-dragDX,slideMin,slideMax);
      // Si el reglón llega a los extremos, limita también el pelito al rango visible
      hairX=clamp(hairX,hairMin,hairMax);
    }
    drawAll();
  });
  window.addEventListener('mouseup',()=>dragging=null);
  canvas.addEventListener('dblclick',()=>{slideOffset=0;hairX=P.left+innerW*0.6;drawAll();});

  drawAll();
})();
</script>
</body>
</html>
