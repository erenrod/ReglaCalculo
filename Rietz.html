<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regla de Cálculo Rietz – trigonométrica corregida</title>
<style>
  :root { --bg:#0d1117; --ink:#0f172a; --hair:#d41111; --panel-bg:#1b2333; }
  body{ margin:0; background:var(--bg); color:#dbe7ff; font-family:system-ui,sans-serif;
        display:flex; flex-direction:column; align-items:center; padding:24px; gap:12px;}
  h1{ margin:0; font-size:18px; color:#e8f2ff;}
  .wrapper{ display:flex; gap:24px; align-items:flex-start;}
  canvas{ background:#f8fbff; border-radius:10px; box-shadow:0 6px 30px rgba(0,0,0,.3); display:block;}
  .panel{ width:260px; background:var(--panel-bg); color:#eaf1ff; border-radius:12px; padding:16px;
          box-shadow:0 4px 20px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:8px;}
  .panel h2{ font-size:15px; margin:0 0 6px; text-align:center; color:#5bd4ff;}
  .readout{ display:flex; justify-content:space-between; border-bottom:1px solid #27344b; padding:2px 0; font-size:13px;}
  .readout span{ font-family:monospace; color:#fff;}
  .hint{ font-size:13px; color:#9fb1cc; text-align:center;}
</style>
</head>
<body>
  <h1>Regla de Cálculo Rietz – trigonométrica (mapeo corregido)</h1>
  <div class="wrapper">
    <canvas id="rule" width="1550" height="900"></canvas>
    <div class="panel">
      <h2>Lecturas del pelito</h2>
      <div id="values"></div>
    </div>
  </div>
  <div class="hint">Arrastra el reglón móvil (B, CI, C). Mueve la línea roja (pelito) para leer. Doble clic para centrar.</div>

<script>
(() => {
  const canvas=document.getElementById("rule");
  const ctx=canvas.getContext("2d");
  const W=canvas.width, H=canvas.height;
  const P={ left:80, right:40 };
  const innerW=W-P.left-P.right;
  const panel=document.getElementById("values");

  const deg2rad = d => d * Math.PI / 180;
  const rad2deg = r => r * 180 / Math.PI;

  // Orden y posiciones (L separada de K; nombres siempre fijos)
  const lanes=[
    { key:'L',  y:  80,  h:26, type:'fixed', label:'L (log₁₀)',         tickLabelSide:'bottom' },
    { key:'K',  y: 155, h:26, type:'fixed', label:'K (x³)',             tickLabelSide:'bottom' },
    { key:'A',  y: 230, h:26, type:'fixed', label:'A (x²)',             tickLabelSide:'bottom' },
    { key:'B',  y: 305, h:26, type:'slide', label:'B (x²)',             tickLabelSide:'bottom' },
    { key:'CI', y: 380, h:26, type:'slide', label:'CI (1/x)',           tickLabelSide:'bottom' },
    { key:'C',  y: 455, h:26, type:'slide', label:'C (×, ÷)',           tickLabelSide:'bottom' },
    { key:'D',  y: 530, h:26, type:'fixed', label:'D (×, ÷)',           tickLabelSide:'bottom' },
    { key:'S',  y: 620, h:26, type:'fixed', label:'S (sin, 5°–90°)',    tickLabelSide:'bottom' },
    { key:'ST', y: 680, h:26, type:'fixed', label:'ST (sen pequeño)',   tickLabelSide:'bottom' },
    { key:'T',  y: 740, h:26, type:'fixed', label:'T (tan, 5°–45°)',    tickLabelSide:'bottom' },
  ];

  let slideOffset=0;
  let hairX=P.left+innerW*0.6;
  let dragging=null, dragDX=0;

  const log10=x=>Math.log(x)/Math.LN10;
  const pow10=x=>Math.pow(10,x);

  // --- Mapeos base C/D ---
  const xFrom={
    normal: v=>P.left+log10(v)*innerW,              // C, D: v in [1,10]
    inv:    v=>P.left+(1-log10(v))*innerW,          // CI: v in [1,10] but inverted
    A:      v=>P.left+(log10(v)/2)*innerW,          // A,B: v in [1,100]
    K:      v=>P.left+(log10(v)/3)*innerW,          // K:   v in [1,1000]
    L:      v=>P.left+log10(v)*innerW,              // L: v=10^t
    // --- TRIG: normalizados a la década [1..10] multiplicando por 10 ---
    S:      θ=>P.left+log10( Math.max(1, Math.min(10, 10*Math.sin(deg2rad(θ))) ) )*innerW,
    ST:     θ=>P.left+log10( Math.max(1, Math.min(10, 10*deg2rad(θ))) )*innerW,
    T:      θ=>P.left+log10( Math.max(1, Math.min(10, 10*Math.tan(deg2rad(θ))) ) )*innerW,
  };

  const valFrom={
    normal: x=>pow10((x-P.left)/innerW),
    inv:    x=>1/pow10((x-P.left)/innerW),
    A:      x=>Math.pow(10,2*(x-P.left)/innerW),
    K:      x=>Math.pow(10,3*(x-P.left)/innerW),
    L:      x=>(x-P.left)/innerW,
    // --- inversas trig sobre década normalizada ---
    S:      x=>{ const v=pow10((x-P.left)/innerW); const s=Math.min(v/10,1); return rad2deg(Math.asin(s)); },
    ST:     x=>{ const v=pow10((x-P.left)/innerW); const r=v/10; return rad2deg(r); },
    T:      x=>{ const v=pow10((x-P.left)/innerW); const t=v/10; return rad2deg(Math.atan(t)); },
  };

  function drawAll(){
    ctx.clearRect(0,0,W,H);
    drawFixedBody();
    drawSlideBody();
    drawHair();
    drawLabels();
    updateReadouts();
  }

  function drawFixedBody(){
    for(const lane of lanes.filter(l=>l.type==='fixed')){
      drawTrack(lane.y,lane.h);
      drawScale(lane,false);
    }
  }
  function drawSlideBody(){
    const top=lanes.find(l=>l.key==='B').y-20;
    const bottom=lanes.find(l=>l.key==='C').y+20;
    ctx.save();
    ctx.translate(slideOffset,0);
    ctx.fillStyle='#fefefe';
    ctx.fillRect(0,top,W,bottom-top);
    for(const lane of lanes.filter(l=>l.type==='slide')){
      drawTrack(lane.y,lane.h);
      drawScale(lane,true);
    }
    ctx.restore();
  }

  function drawTrack(y,h){
    ctx.fillStyle='#eef3f8';
    ctx.strokeStyle='#cfd6e0';
    ctx.beginPath();
    ctx.roundRect(40,y-h/2,W-80,h,6);
    ctx.fill(); ctx.stroke();
  }

  function drawScale(lane,isSlide){
    const slideX=isSlide?slideOffset:0;
    const top=lane.y-lane.h/2;
    const bottom=lane.y+lane.h/2;
    ctx.save();
    ctx.strokeStyle='#1b2430';
    ctx.fillStyle='#1b2430';
    ctx.lineWidth=1;

    const drawTick=(x,len,label)=>{
      ctx.beginPath();
      ctx.moveTo(x+slideX,top);
      ctx.lineTo(x+slideX,top+lane.h*len);
      ctx.stroke();
      if(label!==undefined){
        ctx.font='11px system-ui';
        ctx.textAlign='center';
        ctx.textBaseline='top';
        ctx.fillText(label,x+slideX,bottom+2);
      }
    };

    // --- todas las escalas con 10 subdivisiones por década/tramo ---
    const drawLog=(fnInv=false)=>{
      for(let i=1;i<10;i++){
        const x=fnInv?xFrom.inv(i):xFrom.normal(i);
        drawTick(x,0.8,String(i));
        for(let j=1;j<10;j++){
          const val=i+j/10; if(val>=10) break;
          const xs=fnInv?xFrom.inv(val):xFrom.normal(val);
          drawTick(xs,j%5===0?0.55:0.35);
        }
      }
    };
    const drawAB=(power)=>{
      const fn=(v)=>P.left+(log10(v)/power)*innerW;
      for(let decade=0;decade<power;decade++){
        const start=Math.pow(10,decade), end=start*10;
        for(let i=1;i<10;i++){
          const v=start*i, x=fn(v);
          drawTick(x,0.8,String(v));
          for(let j=1;j<10;j++){
            const vv=v + j*(start/10); if(vv>=end) break;
            const xs=fn(vv);
            drawTick(xs,j%5===0?0.55:0.35);
          }
        }
      }
    };
    const drawL=()=>{
      for(let k=0;k<=10;k++){
        const tMajor=k/10, vMajor=pow10(tMajor), xMajor=xFrom.L(vMajor);
        drawTick(xMajor,0.8,tMajor.toFixed(1));
        if(k<10){
          for(let m=1;m<10;m++){
            const tSub=tMajor+m/100, vSub=pow10(tSub), xSub=xFrom.L(vSub);
            drawTick(xSub,m===5?0.55:0.35);
          }
        }
      }
    };

    // --- Trig: ahora en la década [1..10] (visibles) ---
    const drawS=()=>{ // 5°..90°, marcas cada 5°, subdivisión cada 1°
      for(let d=5; d<=90; d+=5){
        const x=xFrom.S(d); drawTick(x,0.8,String(d));
        for(let j=1;j<5;j++){
          const dd=d+j; if(dd>=90) break;
          const xs=xFrom.S(dd); drawTick(xs, j===2?0.55:0.35);
        }
      }
    };
    const drawST=()=>{ // 0.57°..5.7°, mayores cada 0.5°, subdivisión cada 0.1°
      for(let d=0.5; d<=5.5; d+=0.5){
        const x=xFrom.ST(d); drawTick(x,0.8,d.toFixed(1));
        for(let j=1;j<5;j++){
          const dd=d+j*0.1; if(dd>=5.7) break;
          const xs=xFrom.ST(dd); drawTick(xs, j===2?0.55:0.35);
        }
      }
    };
    const drawT=()=>{ // 5°..45°, mayores cada 5°, subdivisión cada 1°
      for(let d=5; d<=45; d+=5){
        const x=xFrom.T(d); drawTick(x,0.8,String(d));
        for(let j=1;j<5;j++){
          const dd=d+j; if(dd>=45) break;
          const xs=xFrom.T(dd); drawTick(xs, j===2?0.55:0.35);
        }
      }
    };

    switch(lane.key){
      case 'C': case 'D': drawLog(false); break;
      case 'CI': drawLog(true); break;
      case 'A': case 'B': drawAB(2); break;
      case 'K': drawAB(3); break;
      case 'L': drawL(); break;
      case 'S': drawS(); break;
      case 'ST': drawST(); break;
      case 'T': drawT(); break;
    }

    ctx.restore();
  }

  function drawLabels(){
    ctx.save();
    ctx.fillStyle='#1b2430';
    ctx.font='bold 12px system-ui';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    for(const lane of lanes){
      const top=lane.y-lane.h/2;
      ctx.fillText(lane.label,P.left,top-6);
    }
    ctx.restore();
  }

  function drawHair(){
    ctx.save();
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--hair');
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(hairX,40);
    ctx.lineTo(hairX,H-40);
    ctx.stroke();
    ctx.restore();
  }

  function updateReadouts(){
    const data=[];
    for(const lane of lanes){
      let val=null;
      const xPos=hairX-(lane.type==='slide'?slideOffset:0);
      if(valFrom[lane.key]) val=valFrom[lane.key](xPos);
      if(typeof val==='number'){
        if(['S','T','ST'].includes(lane.key)) val = val.toFixed(2) + '°';
        else if(lane.key==='L') val = val.toFixed(3);
        else val = Number(val).toPrecision(6);
      }
      data.push({name:lane.label,val});
    }
    panel.innerHTML=data.map(d=>`<div class="readout"><span>${d.name}</span><span>${d.val}</span></div>`).join('');
  }

  // Interacción
  canvas.addEventListener('mousedown',e=>{
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    if(Math.abs(x-hairX)<10){ dragging='hair'; }
    else if(y> (lanes.find(l=>l.key==='B').y-30) && y< (lanes.find(l=>l.key==='C').y+30)){
      dragging='slide'; dragDX=x-slideOffset;
    }
  });
  canvas.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left;
    if(dragging==='hair') hairX=Math.max(40,Math.min(W-40,x));
    if(dragging==='slide') slideOffset=x-dragDX;
    drawAll();
  });
  window.addEventListener('mouseup',()=>dragging=null);
  canvas.addEventListener('dblclick',()=>{ slideOffset=0; hairX=P.left+innerW*0.6; drawAll(); });

  drawAll();
})();
</script>
</body>
</html>
