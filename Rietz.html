<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regla de Cálculo Rietz – Multicursor Total</title>
<style>
  :root { --bg:#0d1117; --hair:#d41111; --panel-bg:#1b2333; }
  body{ margin:0; background:var(--bg); color:#dbe7ff; font-family:system-ui,sans-serif;
        display:flex; flex-direction:column; align-items:center; padding:24px; gap:12px;}
  h1{ margin:0; font-size:18px; color:#e8f2ff;}
  .wrapper{ display:flex; gap:24px; align-items:flex-start;}
  canvas{ background:#f8fbff; border-radius:10px; box-shadow:0 6px 30px rgba(0,0,0,.3); display:block;}
  .panel{ width:330px; background:var(--panel-bg); border-radius:12px; padding:16px;
          box-shadow:0 4px 20px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:10px;}
  .panel h2{ font-size:15px; margin:0 0 6px; text-align:center; color:#5bd4ff;}
  .readout{ display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid #27344b; padding:2px 0; font-size:13px;}
  .readout input{ width:90px; background:#0e1725; color:#fff; border:1px solid #324156;
                  border-radius:6px; padding:2px 4px; font-family:monospace; font-size:13px; text-align:right;}
  .hint{ font-size:13px; color:#9fb1cc; text-align:center;}
</style>
</head>
<body>
  <h1>Regla de Cálculo Rietz – Multicursor Total</h1>
  <div class="wrapper">
    <canvas id="rule" width="1550" height="940"></canvas>
    <div class="panel">
      <h2>Lecturas del pelito</h2>
      <div id="values"></div>
      <h2>Cursores independientes</h2>
      <div class="readout"><span>B (verde)</span><input id="valB" type="number" step="any" value="2"></div>
      <div class="readout"><span>CI (violeta)</span><input id="valCI" type="number" step="any" value="5"></div>
      <div class="readout"><span>C (azul)</span><input id="valC" type="number" step="any" value="3"></div>
      <div class="readout"><span>L (amarillo)</span><input id="valL" type="number" step="any" value="0.5"></div>
      <div class="readout"><span>K (naranja)</span><input id="valK" type="number" step="any" value="8"></div>
      <div class="readout"><span>A (marrón)</span><input id="valA" type="number" step="any" value="4"></div>
      <div class="readout"><span>D (negro)</span><input id="valD" type="number" step="any" value="6"></div>
    </div>
  </div>
  <div class="hint">Puedes mover el pelito o marcar posiciones manualmente en cualquier escala.</div>

<script>
(() => {
  const canvas=document.getElementById("rule");
  const ctx=canvas.getContext("2d");
  const W=canvas.width, H=canvas.height;
  const P={ left:80, right:40 };
  const innerW=W-P.left-P.right;
  const panel=document.getElementById("values");
  const deg2rad = d => d * Math.PI / 180;
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

  const lanes=[
    { key:'L',  y:  80,  h:26, type:'fixed' },
    { key:'K',  y: 155, h:26, type:'fixed' },
    { key:'A',  y: 230, h:26, type:'fixed' },
    { key:'B',  y: 305, h:26, type:'slide' },
    { key:'CI', y: 380, h:26, type:'slide' },
    { key:'C',  y: 455, h:26, type:'slide' },
    { key:'D',  y: 530, h:26, type:'fixed' },
    { key:'S',  y: 620, h:26, type:'fixed' },
    { key:'ST', y: 680, h:26, type:'fixed' },
    { key:'T',  y: 740, h:26, type:'fixed' },
  ];

  const slideTop=lanes.find(l=>l.key==='B').y-30;
  const slideBottom=lanes.find(l=>l.key==='C').y+30;
  const slideMin=-innerW*0.9;
  const slideMax=innerW*0.9;
  const hairMin=P.left;
  const hairMax=P.left+innerW;

  let slideOffset=0;
  let hairX=P.left+innerW*0.6;
  let dragging=null, dragDX=0;

  const log10=x=>Math.log(x)/Math.LN10;
  const pow10=x=>Math.pow(10,x);

  const xFrom = {
    normal: v => P.left + ((log10(v) - log10(1)) / (log10(10) - log10(1))) * innerW,
    inv:    v => P.left + (1 - ((log10(v) - log10(1)) / (log10(10) - log10(1)))) * innerW,
    A:      v => P.left + ((log10(v) - log10(1)) / (log10(100) - log10(1))) * innerW,
    K:      v => P.left + ((log10(v) - log10(1)) / (log10(1000) - log10(1))) * innerW,
    L:      v => P.left + (v / 1.0) * innerW,
    S:      θ => P.left + ((log10(10*Math.sin(deg2rad(θ))) - log10(1)) / (log10(10) - log10(1))) * innerW,
    ST:     θ => {
      const θmin = 0.5, θmax = 5.7;
      const val = (deg2rad(θ) - deg2rad(θmin)) / (deg2rad(θmax) - deg2rad(θmin));
      return P.left + clamp(val, 0, 1) * innerW;
    },
    T:      θ => P.left + ((log10(10*Math.tan(deg2rad(θ))) - log10(1)) / (log10(10) - log10(1))) * innerW,
  };

  const valFrom = {
    normal: x => pow10(((x - P.left) / innerW) * (log10(10) - log10(1)) + log10(1)),
    inv:    x => 1 / pow10(((x - P.left) / innerW) * (log10(10) - log10(1)) + log10(1)),
    A:      x => pow10(((x - P.left) / innerW) * (log10(100) - log10(1)) + log10(1)),
    K:      x => pow10(((x - P.left) / innerW) * (log10(1000) - log10(1)) + log10(1)),
    L:      x => (x - P.left) / innerW,
  };

  const inputs = {
    B: document.getElementById("valB"),
    CI: document.getElementById("valCI"),
    C: document.getElementById("valC"),
    L: document.getElementById("valL"),
    K: document.getElementById("valK"),
    A: document.getElementById("valA"),
    D: document.getElementById("valD")
  };

  const colors = {
    B:'#00cc66', CI:'#bb66ff', C:'#0088ff',
    L:'#ffcc00', K:'#ff8800', A:'#885500', D:'#111'
  };

  let cursors={};

  function updateCursors(){
    cursors={
      B: xFrom.normal(parseFloat(inputs.B.value)||1),
      CI: xFrom.inv(parseFloat(inputs.CI.value)||1),
      C: xFrom.normal(parseFloat(inputs.C.value)||1),
      L: xFrom.L(parseFloat(inputs.L.value)||0),
      K: xFrom.K(parseFloat(inputs.K.value)||1),
      A: xFrom.A(parseFloat(inputs.A.value)||1),
      D: xFrom.normal(parseFloat(inputs.D.value)||1)
    };
    drawAll();
  }

  for(let k in inputs) inputs[k].addEventListener("change",updateCursors);

  function drawAll(){
    ctx.clearRect(0,0,W,H);
    drawTracks();
    drawCursors();
    drawHair();
    updateReadouts();
  }

  function drawTracks(){
    ctx.save();ctx.strokeStyle='#cfd6e0';
    for(const l of lanes){ctx.strokeRect(40,l.y-l.h/2,W-80,l.h);}
    ctx.restore();
  }

  function drawCursors(){
    for(const [key,x] of Object.entries(cursors)){
      const lane=lanes.find(l=>l.key===key);
      const y=lane.y; const offset=(lane.type==='slide')?slideOffset:0;
      ctx.save();ctx.strokeStyle=colors[key];ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x+offset,y-15);ctx.lineTo(x+offset,y+15);ctx.stroke();ctx.restore();
    }
  }

  function drawHair(){
    ctx.save();ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--hair');
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hairX,40);ctx.lineTo(hairX,H-40);ctx.stroke();ctx.restore();
  }

  function updateReadouts(){
    const showLanes=lanes.filter(l=>!['S','ST','T'].includes(l.key));
    panel.querySelector("#values").innerHTML=showLanes.map(l=>{
      let xPos=(l.type==='slide')?hairX-slideOffset:hairX;
      const valFn=valFrom[(l.key==='CI')?'inv':(l.key==='A'||l.key==='K'||l.key==='L')?l.key:'normal'];
      const val=valFn(clamp(xPos,P.left,P.left+innerW));
      const valStr=(l.key==='L')?val.toFixed(3):val.toPrecision(6);
      return `<div class="readout"><span>${l.key}</span><input type="number" step="any" value="${valStr}" data-key="${l.key}"></div>`;
    }).join('');
    panel.querySelectorAll("#values input").forEach(inp=>{
      inp.addEventListener('change',()=>{
        const key=inp.dataset.key,value=parseFloat(inp.value);
        if(isNaN(value))return;
        moveHairTo(key,value);
      });
    });
  }

  function moveHairTo(key,value){
    let x;
    if(key==='CI')x=xFrom.inv(value);
    else if(key==='A'||key==='K'||key==='L')x=xFrom[key](value);
    else x=xFrom.normal(value);
    const lane=lanes.find(l=>l.key===key);
    if(lane?.type==='slide')hairX=clamp(x+slideOffset,hairMin,hairMax);
    else hairX=clamp(x,hairMin,hairMax);
    drawAll();
  }

  canvas.addEventListener('mousedown',e=>{
    const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
    if(Math.abs(x-hairX)<10){dragging='hair';}
    else if(y>slideTop&&y<slideBottom){dragging='slide';dragDX=x-slideOffset;}
  });
  canvas.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const r=canvas.getBoundingClientRect();const x=e.clientX-r.left;
    if(dragging==='hair')hairX=clamp(x,hairMin,hairMax);
    if(dragging==='slide'){slideOffset=clamp(x-dragDX,slideMin,slideMax);hairX=clamp(hairX,hairMin,hairMax);}
    drawAll();
  });
  window.addEventListener('mouseup',()=>dragging=null);
  canvas.addEventListener('dblclick',()=>{slideOffset=0;hairX=P.left+innerW*0.6;drawAll();});

  updateCursors();
})();
</script>
</body>
</html>
